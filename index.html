<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancia i Dadi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a5f2e">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0a5f2e;
            background-image: radial-gradient(circle at 50% 50%, #1a7a4a 0%, #0a5f2e 70%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            background-color: #1a7a4a;
            color: white;
            border: 2px solid #0a5f2e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.active {
            background-color: #0a5f2e;
            transform: scale(1.05);
        }
        button:hover {
            background-color: #2d9a6a;
        }
        #roll-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #d4af37;
            color: #000;
            border: none;
            border-radius: 50px;
            margin-top: 20px;
            font-weight: bold;
        }
        #roll-btn:active {
            transform: scale(0.95);
        }
        .dice-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            min-height: 100px;
        }
        .die {
            width: 70px;
            height: 70px;
            background-color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .rolling {
            animation: roll 0.5s ease-in-out;
        }
        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
    </style>
</head>
<body>
    <h1>🎲 Lancia i Dadi</h1>
    
    <div class="controls">
        <button data-count="1">1 Dado</button>
        <button data-count="2">2 Dadi</button>
        <button data-count="3">3 Dadi</button>
        <button data-count="4">4 Dadi</button>
    </div>
    
    <button id="roll-btn">Lancia!</button>
    
    <div id="dice-container" class="dice-container">
        <!-- I dadi verranno generati via JS -->
    </div>

    <script src="script.js"></script>
</body>
</html>
